<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jalwa - Apna Jalwa Dikhao</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icons/icon-192.png">
<link rel="apple-touch-icon" href="/icons/icon-192.png">
<meta name="theme-color" content="#ec4899">
<meta name="description" content="Pakistan ki apni TikTok jesi app - Reels, Live, Chat, Ads, Coins aur Kamai">
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-black text-white">
<div id="loginScreen" class="min-h-screen flex flex-col items-center justify-center px-6">
  <div class="w-full max-w-[400px]">
    <div class="text-center"><div class="text-5xl font-black">JAL<span class="text-pink-500">WA</span> 🔥</div><p class="text-zinc-400 mt-2">Apna Jalwa Dikhao • Reels • Live • Kamai</p><p class="bg-pink-600 px-3 py-1 rounded-full text-xs font-bold inline-block mt-3">FREE Coins 500</p></div>
    <div class="bg-zinc-900 border border-zinc-800 rounded-3xl p-5 mt-6">
      <div class="flex bg-zinc-800 rounded-full p-1 mb-4">
        <button id="tabMobile" onclick="switchLogin('mobile')" class="flex-1 py-2.5 rounded-full bg-white text-black font-bold text-sm">Mobile Number</button>
        <button id="tabGmail" onclick="switchLogin('gmail')" class="flex-1 py-2.5 rounded-full font-bold text-sm">Gmail</button>
      </div>
      <div id="mobileBox">
        <label class="text-xs text-zinc-400">STEP 1 - Number likho</label>
        <input id="phoneInput" type="tel" placeholder="0322-xxxxxxx" class="w-full mt-1 bg-zinc-800 rounded-2xl px-4 py-3.5 outline-none">
        <button onclick="sendOTP()" class="w-full mt-3 bg-zinc-700 py-3 rounded-2xl font-bold">STEP 2 - OTP Bhejo dabao</button>
        <div id="otpBox" class="hidden mt-3"><label class="text-xs text-yellow-300">STEP 3 - OTP me 1234 likho (Demo OTP)</label><input id="otpInput" placeholder="1234" class="w-full mt-1 bg-zinc-800 border border-yellow-500 rounded-2xl px-4 py-3.5 outline-none"></div>
        <button onclick="loginWithMobile()" class="w-full mt-4 bg-gradient-to-r from-pink-600 to-red-600 py-3.5 rounded-2xl font-black">STEP 4 - LOGIN dabao</button>
        <p class="text-[11px] text-zinc-400 text-center mt-2">OTP nahi aaya? 1234 likh ke LOGIN dabao, khul jayega.</p>
      </div>
      <div id="gmailBox" class="hidden">
        <input id="gmailInput" placeholder="tumhara@gmail.com" class="w-full bg-zinc-800 rounded-2xl px-4 py-3.5 outline-none">
        <input id="nameInput" placeholder="Apna Naam" class="w-full mt-3 bg-zinc-800 rounded-2xl px-4 py-3.5 outline-none">
        <button onclick="loginWithGmail()" class="w-full mt-4 bg-white text-black py-3.5 rounded-2xl font-black">Gmail se Login</button>
      </div>
      <button onclick="guestLogin()" class="w-full mt-4 bg-green-600 py-3 rounded-2xl font-bold">Guest - Bina Login Ke Andar Jao (Test ke liye)</button>
    </div>
    <p class="text-[11px] text-zinc-500 text-center mt-3">Agar phir bhi na khule to Guest wala button dabao, app andar se khul jayegi.</p>
  </div>
</div>
<div id="appScreen" class="hidden max-w-[430px] mx-auto min-h-screen pb-[80px]">
  <div class="sticky top-0 bg-black/90 px-3 py-3 flex justify-between items-center border-b border-zinc-800"><div class="font-black text-xl">JAL<span class="text-pink-500">WA</span></div><div class="bg-yellow-400 text-black px-3 py-1.5 rounded-full font-black">Coins <span id="coinTop">500</span></div></div>
  <div id="reelsContainer" class="px-2 pt-2 flex flex-col gap-3"></div>
  <div class="px-3 py-4"><div class="bg-gradient-to-r from-pink-600 to-red-600 rounded-3xl p-4"><div class="font-black">Ad Dekho, 50 Coins Muft</div><button onclick="watchAd()" class="mt-3 bg-white text-black px-4 py-2.5 rounded-full font-bold w-full">Ad Dekho +50 Coins</button></div></div>
  <div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[430px] bg-black border-t border-zinc-800 flex justify-around py-2"><button class="text-xs">Home</button><button onclick="alert('Discover')" class="text-xs">Discover</button><button onclick="alert('Post ban gayi!')" class="w-[52px] h-[52px] -mt-6 bg-pink-600 rounded-2xl text-2xl font-black">+</button><button onclick="alert('Chat')" class="text-xs">Chat</button><button onclick="alert('Profile - Kamai')" class="text-xs">Profile</button></div>
</div>
<script>
let coins=500;
let reels=[
 {u:'@SamandarBoy',c:'Samandar me maza! 🐟',img:'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=800',likes:12400},
 {u:'@CricketKing',c:'Gali cricket 🏏',img:'https://images.unsplash.com/photo-1531415074968-036ba1b575da?w=800',likes:8900},
 {u:'@BiryaniQueen',c:'Karachi Biryani 😋',img:'https://images.unsplash.com/photo-1589302168068-964664d93dc0?w=800',likes:15200},
];
function switchLogin(t){document.getElementById('mobileBox').classList.toggle('hidden',t!=='mobile');document.getElementById('gmailBox').classList.toggle('hidden',t!=='gmail');}
function sendOTP(){document.getElementById('otpBox').classList.remove('hidden');document.getElementById('otpInput').value='1234';alert('OTP: 1234 - Maine khud bhar diya hai, ab LOGIN dabao');}
function doLogin(){document.getElementById('loginScreen').classList.add('hidden');document.getElementById('appScreen').classList.remove('hidden');render();}
function loginWithMobile(){let ph=document.getElementById('phoneInput').value.trim();let otp=document.getElementById('otpInput').value.trim();if(!ph){alert('Pehle number likho');return;}if(otp!=='' && otp!=='1234'){alert('OTP 1234 hai');return;}if(otp===''){document.getElementById('otpBox').classList.remove('hidden');alert('OTP Bhejo dabao, maine 1234 bhar diya hai, phir LOGIN dabao');return;}doLogin();}
function loginWithGmail(){if(!document.getElementById('gmailInput').value){alert('Gmail likho');return;}doLogin();}
function guestLogin(){doLogin();}
function render(){document.getElementById('reelsContainer').innerHTML=reels.map((r,i)=>'<div class="rounded-[28px] overflow-hidden relative h-[520px]"><img src="'+r.img+'" class="absolute inset-0 w-full h-full object-cover"><div class="absolute inset-0 bg-gradient-to-t from-black to-transparent"></div>'+(i===1?'<div class="absolute top-3 left-3 bg-yellow-400 text-black px-2 py-1 rounded-full text-[10px] font-black">SPONSORED AD</div>':'')+'<div class="absolute bottom-0 p-4"><b>'+r.u+'</b><p>'+r.c+'</p><p class="text-pink-300 text-xs">#Jalwa #Karachi</p></div></div>').join('');}
function watchAd(){coins+=50;document.getElementById('coinTop').textContent=coins;alert('+50 Coins mil gaye!');}
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').then(()=>console.log('SW OK')).catch(e=>console.log('SW fail',e));});}
</script>
</body>
</html>
